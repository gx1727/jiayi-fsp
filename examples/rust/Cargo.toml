[workspace]
resolver = "2"
members = ["fsp-core", "fsp-sim", "server", "client"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[workspace.dependencies]
fsp-core = { path = "fsp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
