# JIAYI-FSP Mosquitto ACL 示例
# 规范来源: docs/spec/21-acl-and-auth.md、docs/spec/22-topic-spec.md
#
# Topic 格式: /jiayi/fsp/{role}/{client_id}/{action}   （固定 5 层，必须带前导斜杠）
#
# 配合 Broker 配置使用:
#   acl_file /etc/mosquitto/acl.conf
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd
#
# 说明: Mosquitto 中 deny 规则优先于 allow，且未归属到具体 user 的
#       topic 行对所有用户生效。因此本文件不使用全局 deny 段，
#       跨 client_id 的隔离完全由下面的 per-user 规则保证。

# ---------- Client ----------
# Client 只能以自己的 client_id 发布，且只能订阅发往自己的消息。
user client1
topic readwrite /jiayi/fsp/client/client1/#
topic read        /jiayi/fsp/server/client1/#

# 若需支持多台设备，为每个 client_id 重复一段，例如:
# user client2
# topic readwrite /jiayi/fsp/client/client2/#
# topic read        /jiayi/fsp/server/client2/#

# ---------- Server ----------
# Server 订阅所有 client 的消息，发布所有 server 消息。
# 注意订阅过滤器必须为 5 层：/jiayi/fsp/client/+/#
user server
topic read        /jiayi/fsp/client/+/#
topic readwrite   /jiayi/fsp/server/#
